name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend-tests:
    name: Backend tests (pytest isolated temp-DB, plus pinned decompositions)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # The isolated API suite (test_api_*.py) — each test gets its own
      # throwaway temp-file DB via conftest.py, so this never touches a real
      # kanji.db and needs no seed data checked in.
      - name: Run pytest
        run: python -m pytest -v

      # The pinned-decomposition suite. This used to be skipped here on the
      # grounds that "there is no kanji.db in a fresh CI checkout for it to
      # read", which was true and beside the point: data.txt, data_from_pdf.txt
      # and heisig-kanjis.csv are all checked in, so CI can seed one in a few
      # seconds exactly the way an audit session does. Leaving it out cost a
      # real regression — a 2026-09-19 change landed with a stale rtk2819 pin
      # and nothing noticed until someone ran the script by hand the next day.
      # No network needed: it reads only the seeded DB and primitive_images/.
      - name: Seed a throwaway kanji.db from the checked-in source files
        run: |
          python -c "import database; database.init_db(); c = database.get_db(); \
                     database.migrate_schema(c); c.close(); database.import_data()"

      - name: Run pinned-decomposition regression checks
        run: python test_regression_fixes.py

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The production build generates crawlable kanji pages from the database.
      # CI starts from a clean checkout, so seed a disposable database from the
      # checked-in sources before that generation step.
      - name: Seed database for SEO build
        run: |
          cd ../backend
          python3 -c "import database; database.init_db(); c = database.get_db(); \
                     database.migrate_schema(c); c.close(); database.import_data()"

      - name: Build
        run: npm run build:prod
