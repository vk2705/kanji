# Rate-limited login/register/Google-login — the highest-risk endpoints for
# credential-stuffing/brute-force; small burst since a real user only submits this
# form once every few seconds at most. All three are POST-only in the app itself,
# so no read/write path-sharing concern here.
location ~ ^/kanji/api/(auth/(?:login|register|google))$ {
    limit_req zone=kanji_auth burst=5 nodelay;
    proxy_pass http://127.0.0.1:8000/$1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Rate-limited analytics pageview — no auth required at all, so this is the easiest
# unbounded page_views growth vector (architecture review finding #4). A real
# frontend calls this once per app load; looser than the auth limit since a
# legitimate user opening many tabs/reloading shouldn't get falsely blocked.
location = /kanji/api/analytics/pageview {
    limit_req zone=kanji_analytics burst=20 nodelay;
    proxy_pass http://127.0.0.1:8000/analytics/pageview;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Rate-limited contribution writes. /kanji/api/kanji/... is shared between POST
# /kanji (create, rate-limited), POST /kanji/{id}/image and /kanji/{id}/decompositions,
# PATCH /kanji/{id}/visibility (all rate-limited), and GET /kanji/{id} (read, NOT
# rate-limited at the write tier -- the detail page can legitimately be loaded
# often). Uses the kanji_write_nonget zone (kanji-ratelimit.conf's $kanji_write_key
# map), which is a no-op for GET/HEAD requests, instead of limit_except (which
# doesn't accept limit_req in its context at all).
location ~ ^/kanji/api/(kanji(?:/.*)?)$ {
    limit_req zone=kanji_write_nonget burst=15 nodelay;
    proxy_pass http://127.0.0.1:8000/$1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# aliases/stories/decompositions/{id}/review are all POST-only in the app (no GET
# under these prefixes at all except /me/contributions, handled by the catch-all
# below), so a straight limit_req is safe here without needing limit_except.
location ~ ^/kanji/api/((?:aliases|stories|decompositions)(?:/.*)?)$ {
    limit_req zone=kanji_write burst=15 nodelay;
    proxy_pass http://127.0.0.1:8000/$1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /kanji/api/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
