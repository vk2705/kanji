# Rate-limit zones for the kanji app (srv.alteon.help/kanji/) — architecture review
# finding #4 (docs/2026-08-31-architecture-review.md in the kanji repo): login,
# register, Google login, contributions, reviews, and /analytics/pageview had no
# rate limiting at all, and /analytics/pageview in particular needs no auth, making
# it the easiest unbounded-DB-growth vector. Declared at the http{} block level
# (nginx requirement for limit_req_zone) via conf.d/ so it doesn't need editing the
# shared nginx.conf this box's other projects also rely on.
#
# $binary_remote_addr keys by client IP; zone sizes (10m ≈ 160k tracked IPs) are
# generous for this site's traffic level.
limit_req_zone $binary_remote_addr zone=kanji_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=kanji_write:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=kanji_analytics:10m rate=60r/m;

# limit_req can't be made conditional directly (no "only if POST" option, and
# limit_except doesn't accept limit_req in its context), so the GET/HEAD-vs-write
# split on /kanji/api/kanji(/...)? (shared between the read-only GET /kanji/{id}
# detail lookup and several rate-limited write endpoints) uses this map instead:
# GET/HEAD requests get an empty key, and limit_req_zone treats an empty key as
# "don't rate-limit this request" (documented nginx behavior), so only non-GET/HEAD
# requests actually consume the kanji_write zone's bucket.
map $request_method $kanji_write_key {
    default     $binary_remote_addr;
    GET         "";
    HEAD        "";
}
limit_req_zone $kanji_write_key zone=kanji_write_nonget:10m rate=30r/m;

# Applies to every limit_req below unless a location overrides it: log-and-serve a
# plain 429 rather than nginx's default (which would otherwise need its own error
# page wired up specifically for this).
limit_req_status 429;
