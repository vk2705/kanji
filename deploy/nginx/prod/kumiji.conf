# kumiji.kermit.is-a.dev — THE CANONICAL HOST for KumiJi Glyph Explorer.
#
# Swapped 2026-11-07: this name used to 301 to kanji.alteon.help, and now serves
# the site itself while kanji.alteon.help 301s here (see prod/kanji.conf). The
# alteon.help domain is being given up, and this name is not on it.
#
# Why this name survives the handover: kumiji.kermit.is-a.dev is an **A record**
# straight to this VM (161.153.96.217), not a CNAME to kanji.alteon.help, so it
# keeps resolving after the alteon.help zone goes away. `kermit.is-a.dev` itself
# is registered via is-a-dev/register PR #59266 and serves the developer page
# (prod/kermit.conf); `kumiji` and `kanjimcp` are separate records under it.
#
# TLS: this block needs a certificate whose names are ONLY is-a.dev names. The
# 2026-10-31 cert that first covered this name was issued as
# `certbot --nginx -d kumiji.alteon.help -d kumiji.kermit.is-a.dev`, i.e. a
# single lineage named after the domain being abandoned — once alteon.help stops
# resolving, renewal of that lineage fails the HTTP-01 challenge for its
# alteon.help name and the WHOLE cert expires, taking this name down with it.
# DEPLOY_README.md's "Canonical host move" section has the one-time reissue.
#
# Live path: /etc/nginx/sites-available/kumiji.conf, symlinked into sites-enabled.

# `/?kanji=<id>` deep links (every static /kanji/<id>.html page links into the
# app this way) are served the SPA's index.html, whose static canonical is the
# site root. Search Console reported them as "Alternate page with proper
# canonical tag" (2026-11-12). Better to point each one at the static page for
# the same kanji, so whatever signal those URLs collect lands there. The id is
# restricted to a safe charset here and the target file must exist (checked in
# the server block), so an unknown or user-created id keeps the root canonical.
map $arg_kanji $kanji_seo_file {
    default                  "";
    "~^[A-Za-z0-9._-]+$"     /kanji/$arg_kanji.html;
}

server {
    server_name kumiji.kermit.is-a.dev;

    root /opt/kanji/frontend/dist;
    index index.html;

    # Canonical for `location = /` (see the map above). Server level on purpose:
    # an `if` inside a location becomes its own nested location that drops
    # try_files, and the root then falls through to the catch-all unrewritten.
    # With no ?kanji= the -f test stats the document root, a directory: false.
    set $kanji_canonical "/";
    if (-f $document_root$kanji_seo_file) {
        set $kanji_canonical $kanji_seo_file;
    }

    # Frontend built with base '/' (npm run build:prod — dedicated VM, not sharing
    # nginx with other projects, so no /kanji/ path prefix needed for the app
    # itself). The backend API keeps the /kanji/api/ prefix unchanged from the
    # shared-box deployment, since frontend/src/api.js hardcodes that path for
    # prod builds — matching it here avoids touching that shared source file for
    # a single deploy's URL-cosmetics preference.

    # Rate-limited login/register/Google-login.
    location ~ ^/kanji/api/(auth/(?:login|register|google))$ {
        limit_req zone=kanji_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rate-limited analytics pageview + engagement event — no auth required at all.
    location ~ ^/kanji/api/analytics/(pageview|event)$ {
        limit_req zone=kanji_analytics burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000/analytics/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rate-limited contribution writes under /kanji/api/kanji/... (GET is exempt
    # via the $kanji_write_key map in kanji-ratelimit.conf).
    location ~ ^/kanji/api/(kanji(?:/.*)?)$ {
        limit_req zone=kanji_write_nonget burst=15 nodelay;
        proxy_pass http://127.0.0.1:8000/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # aliases/stories/decompositions/{id}/review are POST-only.
    location ~ ^/kanji/api/((?:aliases|stories|decompositions)(?:/.*)?)$ {
        limit_req zone=kanji_write burst=15 nodelay;
        proxy_pass http://127.0.0.1:8000/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Catch-all for everything else under the API prefix (search, auth/me,
    # auth/logout, auth/preferences, me/contributions, uploads/, primitive-images/).
    location /kanji/api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The site root, including `/?kanji=<id>` deep links: same index.html as the
    # catch-all below, but with the canonical rewritten to /kanji/<id>.html when
    # that static page exists ($kanji_canonical, set at server level above).
    # try_files with a non-final file argument serves index.html in this
    # location rather than redirecting internally, so sub_filter applies.
    # The sub_filter pattern must match frontend/index.html's canonical tag
    # byte for byte; if the canonical host changes, change it here too.
    location = / {
        sub_filter '<link rel="canonical" href="https://kumiji.kermit.is-a.dev/" />'
                   '<link rel="canonical" href="https://kumiji.kermit.is-a.dev$kanji_canonical" />';
        sub_filter_once on;
        try_files /index.html =404;
    }

    # SPA static files, served from the app's own root.
    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/kumiji.kermit.is-a.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/kumiji.kermit.is-a.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = kumiji.kermit.is-a.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name kumiji.kermit.is-a.dev;
    return 404; # managed by Certbot


}
