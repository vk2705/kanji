# Alternate names for the site, added 2026-10-31 with the "KumiJi Glyph Explorer"
# rename: kumiji.alteon.help and kumiji.kermit.is-a.dev are CNAMEs to this VM and
# redirect permanently to the canonical https://kanji.alteon.help, rather than
# serving a second copy of the site. Google sign-in only works on the OAuth
# client's listed origins, login cookies are per host, and one canonical host
# keeps Search Console's signal in one place.
#
# Live path: /etc/nginx/sites-available/kumiji.conf, symlinked into sites-enabled.
# The HTTPS listener and the port-80 block below were written by `sudo certbot
# --nginx -d kumiji.alteon.help -d kumiji.kermit.is-a.dev` (2026-10-31, cert
# expires 2027-01-29, renewed by certbot's timer). Plain HTTP goes to https on the
# same name first, then to kanji.alteon.help: two hops, harmless.
server {
    server_name kumiji.alteon.help kumiji.kermit.is-a.dev;

    return 301 https://kanji.alteon.help$request_uri;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/kumiji.alteon.help/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/kumiji.alteon.help/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = kumiji.kermit.is-a.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = kumiji.alteon.help) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name kumiji.alteon.help kumiji.kermit.is-a.dev;
    return 404; # managed by Certbot




}