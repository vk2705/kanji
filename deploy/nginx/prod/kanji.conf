# The retiring alteon.help names. Both 301 to the canonical host,
# https://kumiji.kermit.is-a.dev (prod/kumiji.conf).
#
# Swapped 2026-11-07. Until then this file served the site at kanji.alteon.help
# and kumiji.* redirected here; the direction is now reversed because the
# alteon.help domain is being given up. Everything under this file is therefore
# temporary — when the domain lapses, delete both blocks, drop the symlink from
# sites-enabled/, and `sudo certbot delete --cert-name kanji.alteon.help`
# (likewise kumiji.alteon.help, kanjimcp.alteon.help) so certbot's timer stops
# trying to renew names that no longer resolve.
#
# Two server blocks rather than one with both names, because each name has its
# own certificate lineage and a block can only present one.
#
# `$request_uri` is preserved, so every indexed deep link
# (/kanji/rtk207.html, /guide/, /privacy.html, the API under /kanji/api/)
# lands on its counterpart rather than on the home page. 301 is deliberate:
# it is the status Search Console's change-of-address and the IndexNow
# resubmit both want to see.
#
# Live path: /etc/nginx/sites-available/kanji.conf, symlinked into sites-enabled.
server {
    server_name kanji.alteon.help;

    return 301 https://kumiji.kermit.is-a.dev$request_uri;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/kanji.alteon.help/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/kanji.alteon.help/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# kumiji.alteon.help — the other old alias, from the 2026-10-31 rename. Same
# destination; its cert is the lineage certbot created that day covering both
# this name and kumiji.kermit.is-a.dev (which is exactly why the canonical host
# needed its own is-a.dev-only cert — see prod/kumiji.conf's TLS note).
server {
    server_name kumiji.alteon.help;

    return 301 https://kumiji.kermit.is-a.dev$request_uri;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/kumiji.alteon.help/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/kumiji.alteon.help/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# Plain HTTP for both retiring names: straight to the canonical host in one hop
# (no reason to bounce through https:// on a name that is going away).
server {
    listen 80;
    listen [::]:80;
    server_name kanji.alteon.help kumiji.alteon.help;

    return 301 https://kumiji.kermit.is-a.dev$request_uri;
}
