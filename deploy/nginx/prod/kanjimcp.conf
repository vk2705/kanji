# The public MCP server (backend/mcp_server.py) — a SEPARATE process/systemd
# unit (kanji-mcp.service) from the main API (kanji-backend.service), listening
# on a different loopback port. See DEPLOY_README.md's "MCP server" section for
# the systemd unit and Certbot setup this file assumes.
#
# Moved 2026-11-07 to kanjimcp.kermit.is-a.dev, off the alteon.help domain that
# is being given up. Its DNS A record already points at this VM.
#
# Both names serve the MCP endpoint directly; the old one is NOT redirected.
# Streamable HTTP speaks POST, and a 301 on a POST is downgraded to GET by many
# HTTP clients instead of being replayed — so a redirect here would break
# already-configured MCP clients rather than move them. They keep working until
# the name is deleted, and the move is announced in the guide page instead.
#
# Live path: /etc/nginx/sites-available/kanjimcp.conf, symlinked into sites-enabled.
server {
    server_name kanjimcp.kermit.is-a.dev;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        # Streamable HTTP is long-lived (SSE-style streaming responses) —
        # without these, a proxied connection can be buffered/closed by nginx
        # mid-stream the same way a websocket upgrade would be.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/kanjimcp.kermit.is-a.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/kanjimcp.kermit.is-a.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# kanjimcp.alteon.help — the retiring name, still serving so that MCP clients
# already pointed at it keep working. Delete this block (and
# `sudo certbot delete --cert-name kanjimcp.alteon.help`) when the domain lapses.
server {
    server_name kanjimcp.alteon.help;

    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/kanjimcp.alteon.help/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/kanjimcp.alteon.help/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    listen 80;
    listen [::]:80;
    server_name kanjimcp.kermit.is-a.dev kanjimcp.alteon.help;

    return 301 https://kanjimcp.kermit.is-a.dev$request_uri;
}
