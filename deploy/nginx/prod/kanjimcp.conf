server {
    server_name kanjimcp.alteon.help;

    # Public, read-only, no-auth MCP server (backend/mcp_server.py) — a
    # SEPARATE process/systemd unit (kanji-mcp.service) from the main API
    # (kanji-backend.service), listening on a different loopback port. See
    # DEPLOY_README.md's "MCP server" section for the systemd unit and
    # Certbot setup this file assumes.
    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        # Streamable HTTP is long-lived (SSE-style streaming responses) —
        # without these, a proxied connection can be buffered/closed by nginx
        # mid-stream the same way a websocket upgrade would be.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/kanjimcp.alteon.help/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/kanjimcp.alteon.help/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = kanjimcp.alteon.help) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name kanjimcp.alteon.help;
    return 404; # managed by Certbot


}
