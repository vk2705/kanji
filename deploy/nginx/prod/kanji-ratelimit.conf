# Rate-limit zones for the kanji app on its dedicated VM (161.153.96.217,
# kanji.alteon.help). Same zones/values as the shared dev box's copy
# (../dev/kanji-ratelimit.conf) — the only difference here is that this is the
# sole site nginx on this VM serves, so these live in conf.d/ directly rather
# than needing to coexist with other projects' rate-limit declarations.
#
# $binary_remote_addr keys by client IP; zone sizes (10m ≈ 160k tracked IPs) are
# generous for this site's traffic level.
limit_req_zone $binary_remote_addr zone=kanji_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=kanji_write:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=kanji_analytics:10m rate=60r/m;

# limit_req can't be made conditional directly, and limit_except doesn't accept
# limit_req in its context, so the GET/HEAD-vs-write split on /kanji/api/kanji(/...)?
# (shared between the read-only GET /kanji/{id} detail lookup and several
# rate-limited write endpoints) uses this map instead: GET/HEAD requests get an
# empty key, and limit_req_zone treats an empty key as "don't rate-limit this
# request" (documented nginx behavior), so only non-GET/HEAD requests actually
# consume the kanji_write zone's bucket.
map $request_method $kanji_write_key {
    default     $binary_remote_addr;
    GET         "";
    HEAD        "";
}
limit_req_zone $kanji_write_key zone=kanji_write_nonget:10m rate=30r/m;

limit_req_status 429;
