# kermit.is-a.dev — the developer page (frontend/public/kermit/ in the kanji repo),
# a static subfolder of the kanji build. Registered via is-a-dev/register PR #59266.
server {
    server_name kermit.is-a.dev;

    root /opt/kanji/frontend/dist/kermit;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/kermit.is-a.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/kermit.is-a.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = kermit.is-a.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name kermit.is-a.dev;
    return 404; # managed by Certbot


}
